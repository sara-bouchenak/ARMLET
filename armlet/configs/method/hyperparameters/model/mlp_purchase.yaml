# @package method.hyperparameters

defaults:
  - default.yaml

model:
  _target_: armlet.utils.net.PurchaseMLP
  hidden_sizes: [1024, 512, 256, 128]

client:

  batch_size: 64

  loss:
    _target_: armlet.utils.custom_loss.IntegerCrossEntropyLoss

  optimizer:
    name: Adagrad
    lr: 0.01
    weight_decay: 1e-4
