[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
license = "GPL-3.0"
license-files = ["LICENSE"]
name = "armlet"
version = "0.3.2"
authors = [
    {name = "Baudouin Naline", email = "baudouin.naline@gmail.com"},
]
description = "Federated Learning System Multi-Criteria Benchmarking Audit"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["federated learning", "deep learning", "pytorch", "multi-criteria benchmarking", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent"
]
dependencies = [
  "pyreadstat==1.3.3",
  "torchaudio==2.10.0",
  "numpy==2.4.2",
  "pandas==3.0.0",
  "scikit-learn==1.8.0",
  "torch==2.10.0",
  "torchmetrics==1.8.2",
  "torchvision==0.25",
  "rich==14.3.2",
  "typer==0.21.1",
  "wandb==0.24.2",
  "datasets==4.5.0",
  "psutil==7.2.2",
  "tensorboard==2.20.0",
  "clearml==2.1.3",
  "matplotlib==3.10.8",
  "seaborn==0.13.2",
  "opacus==1.5.4",
  "diskcache==5.6.3",
  "hydra-core==1.3.2",
  "Cerberus==1.3.8",
  "requests==2.32.5",
  "PyYAML==6.0.3",
  "omegaconf==2.3.0",
  "fluke-fl==0.7.9",
  "optuna==4.9.0",
  "ray==2.58.0",
]

[project.optional-dependencies]
test = ["pytest"]
doc = ["sphinx", "sphinx-design", "sphinx-inline-tabs", "myst-nb", "shibuya"]

[project.scripts]
armlet = "armlet.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "armlet",
    "armlet.attack",
    "armlet.audit",
    "armlet.data",
    "armlet.eval",
    "armlet.FL_pipeline",
    "armlet.plot",
    "armlet.utils"
]
exclude = []
